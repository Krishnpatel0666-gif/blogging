<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Sign Up | LaptopVerse</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/responsive.css"></head>
<body class="auth-page">
<header class="navbar"><a class="logo" href="index.html"><span>LV</span> LaptopVerse</a><button class="menu-toggle" id="menuToggle">☰</button><nav id="mainNav"><a href="index.html">Home</a><a href="laptops.html">Laptops</a><a href="blog.html">Blogs</a><a href="wishlist.html">Wishlist <span class="nav-count" id="wishlistCount">0</span></a><a href="about.html">About</a><a class="nav-login" href="login.html">Login</a></nav><button class="theme-btn" id="themeToggle">☾</button></header>
<main class="auth-wrap"><div class="auth-card"><div class="auth-brand"><span>LV</span><h1>Create account</h1><p>Join LaptopVerse and save your favourites.</p></div><form id="signupForm" novalidate><label>Full name<input id="signupName" type="text" placeholder="Your name"></label><small class="error" id="nameError"></small><label>Email<input id="signupEmail" type="email" placeholder="you@example.com"></label><small class="error" id="signupEmailError"></small><label>Password<input id="signupPassword" type="password" placeholder="Minimum 6 characters"><button type="button" class="show-pass" id="showSignupPassword">Show</button></label><small class="error" id="signupPasswordError"></small><label>Confirm password<input id="confirmPassword" type="password" placeholder="Repeat password"></label><small class="error" id="confirmError"></small><button class="btn primary full" type="submit">Create account</button><p class="form-message" id="signupMessage"></p></form><p class="auth-switch">Already have an account? <a href="login.html">Login</a></p></div></main>
<footer><div class="footer-bottom">© 2026 LaptopVerse</div></footer>
<script src="js/main.js"></script><script src="js/auth.js"></script>
</body></html>
